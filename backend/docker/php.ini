; Production-leaning PHP settings for the AgroSync API container.
expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

memory_limit = 256M
; Advisory, product and listing photos are sent as base64 JSON (up to 6 x 2 MB).
post_max_size = 25M
upload_max_filesize = 20M
max_execution_time = 60

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
